<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Yard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one plate, as in ai-iso-skill. Caption row, the live map, caption row. */
  :root {
    color-scheme: dark;
    --bg:#0c0d0e; --panel:#141516; --edge:#222426;
    --line:#3d4144; --detail:#2b2e30; --body:#17181a; --deck:#1b1d1f; --ground:#161719; --road:#111213;
    --ink:#868b8f; --ink-hi:#e6e8e9; --live:#f4f5f5;
    --ko:#d9dcde; --ko-deck:#e9ebec; --ko-line:#5a5f63; --glass:#0b0c0c;
    --sea:#0f1112; --sand:#1c1d1f; --grass:#141517; --snow:#303336;
    --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8e9397; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2; --ground:#f0f0ef; --road:#e6e7e7;
    --ink:#6a6f73; --ink-hi:#16181a; --live:#0c0d0e;
    --ko:#2a2c2e; --ko-deck:#3a3d40; --ko-line:#0c0d0e; --glass:#e2e4e4;
    --sea:#dde0e1; --sand:#f7f7f5; --grass:#e8e9e7; --snow:#fbfbfa;
  } }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8e9397; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2; --ground:#f0f0ef; --road:#e6e7e7;
    --ink:#6a6f73; --ink-hi:#16181a; --live:#0c0d0e;
    --ko:#2a2c2e; --ko-deck:#3a3d40; --ko-line:#0c0d0e; --glass:#e2e4e4;
    --sea:#dde0e1; --sand:#f7f7f5; --grass:#e8e9e7; --snow:#fbfbfa;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; padding:16px; overflow:hidden; }
  main { height:100%; }
  figure { margin:0; height:100%; min-height:420px; background:var(--panel); border:1px solid var(--edge); border-radius:22px; padding:16px 20px; display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:10px; }
  .cap { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 18px; text-transform:uppercase; letter-spacing:.14em; }
  .cap .hi { color:var(--ink-hi); text-transform:none; letter-spacing:.05em; }
  .stage { position:relative; min-height:0; overflow:hidden; border-radius:14px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
  canvas.over { cursor:pointer; }
  canvas:focus-visible { outline:2px solid var(--live); outline-offset:-2px; border-radius:14px; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--edge); border-radius:8px; cursor:pointer; }
  button:hover { color:var(--ink-hi); border-color:var(--line); }
  button:focus-visible { outline:2px solid var(--live); outline-offset:2px; }
  .tools { position:absolute; left:10px; top:10px; display:grid; gap:6px; }
  .tools button { width:32px; height:32px; padding:0; display:grid; place-items:center; }
  .tools svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.25; stroke-linecap:round; stroke-linejoin:round; }
  .tools .gap { height:4px; }
  .tag { position:absolute; left:0; top:0; transform:translate(-50%, calc(-100% - 10px)); pointer-events:none; white-space:nowrap;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-hi); background:var(--panel);
    border:1px solid var(--live); border-radius:6px; padding:3px 8px; }
  .tag.hover { color:var(--ink); border-color:var(--line); }
  .tag.stop { color:var(--ink); border-style:dashed; transform:translate(-50%, calc(-100% - 6px)); }
  .card { position:absolute; top:10px; right:10px; width:min(300px, calc(100% - 64px)); max-height:calc(100% - 20px); overflow:auto;
    background:var(--panel); border:1px solid var(--edge); border-radius:14px; padding:12px 16px 14px; display:grid; gap:10px; }
  .card .head { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:11px; text-transform:uppercase; letter-spacing:.14em; }
  .card .head button { width:26px; height:26px; padding:0; display:grid; place-items:center; font-size:15px; line-height:1; }
  .card .title { color:var(--ink-hi); font-size:20px; letter-spacing:.04em; line-height:1.1; }
  .card .status { justify-self:start; color:var(--ink-hi); border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:12px; }
  .card dl { margin:0; display:grid; grid-template-columns:auto 1fr; }
  .card dt, .card dd { margin:0; padding:6px 0; border-top:1px solid var(--edge); font-size:12px; }
  .card dd { text-align:right; color:var(--ink-hi); padding-left:12px; }
  .card .bar { display:grid; gap:5px; font-size:11px; text-transform:uppercase; letter-spacing:.12em; }
  .card .bar div { height:6px; border:1px solid var(--line); border-radius:3px; overflow:hidden; }
  .card .bar i { display:block; height:100%; background:var(--live); }
  .card .foot { display:flex; gap:8px; }
  .card .foot button { padding:5px 12px; font-size:12px; text-transform:uppercase; letter-spacing:.12em; }
  .card .foot button[aria-pressed="true"] { color:var(--ink-hi); border-color:var(--live); }
  .sites { display:flex; flex-wrap:wrap; gap:4px 16px; }
  .sites button { border:0; background:none; padding:0; border-radius:3px; color:var(--ink); text-transform:uppercase; letter-spacing:.14em; }
  .sites button:hover, .sites button[aria-current="true"] { color:var(--ink-hi); }
  .sites button[aria-current="true"] { text-decoration:underline; text-underline-offset:5px; }
  .note { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:24px; line-height:1.6; }
  .coarse { display:none; }
  @media (pointer:coarse) { .fine { display:none; } .coarse { display:inline; } }
  [hidden] { display:none !important; }
  @media (max-width:600px) {
    body { padding-block:10px; }
    figure { padding:12px 14px; border-radius:18px; }
    .card { top:auto; bottom:10px; left:10px; right:10px; width:auto; max-height:55%; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",

} }

<body>
<main>
  <figure>
    <div class="cap"><span class="hi">Fig 1 · <span id="clock">10:00</span></span><nav class="sites" aria-label="Places"><button data-view="0" title="Factory (1)">Factory</button><button data-view="1" title="Warehouse (2)">Warehouse</button><button data-view="2" title="Shop (3)">Shop</button><button data-view="3" title="Town (4)">Town</button><button data-view="4" title="Coast (5)">Coast</button></nav></div>
    <div class="stage" id="stage">
      <canvas id="view" tabindex="0" role="img" aria-label="Isometric town, live, through a day and a night: a factory, a warehouse and a shop on the main road, a town of streets, houses and villas, hills behind and the sea in front. Forklifts load pallets onto flatbed trucks, a guard opens the warehouse gate, covered trucks take the goods to the shop, a bus runs its line, people walk the streets, and when someone tries to rob the bank the police come. Drag to pan, scroll or pinch to zoom, click anything for details; a selected vehicle shows its route. Keys: 1 to 5 jump to the factory, warehouse, shop, town and coast, 0 shows the whole map, N skips six hours, [ and ] cycle through vehicles, F follows the selection, Escape closes it, Space pauses."></canvas>
      <div class="tools" id="tools">
        <button id="zoomIn" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
        <button id="zoomOut" title="Zoom out (−)" aria-label="Zoom out"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
        <button id="home" title="Reset view (0)" aria-label="Reset view"><svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h8V6.5"/></svg></button>
        <span class="gap"></span>
        <button id="pause" title="Pause (Space)" aria-label="Pause" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg></button>
        <button id="theme" title="Light or dark (T)" aria-label="Switch light or dark theme"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/><path d="M8 3a5 5 0 0 0 0 10z" fill="currentColor"/></svg></button>
        <button id="time" title="Skip ahead 6 hours (N)" aria-label="Skip ahead six hours"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 4.8V8l2.2 1.6"/></svg></button>
      </div>
      <div class="tag hover" id="tagHover" hidden></div>
      <div class="tag" id="tagSel" hidden></div>
      <div class="tag stop" id="tagStop" hidden></div>
      <aside class="card" id="card" role="region" aria-label="Selection details" hidden>
        <div class="head"><span id="cardKind"></span><button id="cardClose" aria-label="Close details" title="Close (Esc)">×</button></div>
        <div class="title" id="cardTitle"></div>
        <div class="status" id="cardStatus"></div>
        <div class="bar" id="cardBar" hidden><span></span><div><i></i></div></div>
        <dl id="cardRows"></dl>
        <div class="foot" id="cardFoot"><button id="cardFollow" aria-pressed="false" title="Follow (F)">Follow</button></div>
      </aside>
      <p class="note" id="note" hidden></p>
    </div>
    <div class="cap"><span class="fine">Drag to pan · scroll to zoom · click anything</span><span class="coarse">Drag to pan · pinch to zoom · tap anything</span><span class="hi" id="readout">loading</span></div>
  </figure>
</main>

<script>
  // if the module never starts (offline, CDN blocked), say so instead of sitting on "loading"
  setTimeout(() => { if (window.__yardReady) return; const n = document.getElementById('note');
    n.hidden = false; n.textContent = 'The figure could not load three.js from cdn.jsdelivr.net. Check the connection and reload.'; }, 12000);

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('view');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = new URLSearchParams(location.search).has('debug');
const noop = () => {};

// ---- iso kernel (after ai-iso-skill, MIT © Tolga Cohce) ----
// Scene coords are the skill's: +x runs down-right, +y down-left, +z up. Three.js is y-up, so W swaps
// y and z; an orthographic camera looking down (-1,-1,-1) then draws exactly the skill's P(x,y,z).
const W = (x, y, z = 0) => new THREE.Vector3(x, z, y);

const plane = (O, U, V) => { const u = W(...U), v = W(...V), n = new THREE.Vector3().crossVectors(u, v).normalize();
  return new THREE.Matrix4().makeBasis(u, v, n).setPosition(W(...O)); };

const FRONT = (x, y, z) => plane([x, y, z], [1, 0, 0], [0, 0, -1]);  // y = const (faces lower-left); pass its top-left corner

// ---- tokens → materials ----
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// window and lamp read as dark glass and pale metal by day, and light up at night
const FILL_TOK = { ground:'--ground', road:'--road', body:'--body', deck:'--deck', kob:'--ko', kod:'--ko-deck', glass:'--glass', livef:'--live',
  window:'--glass', lamp:'--deck', sea:'--sea', sand:'--sand', grass:'--grass', snow:'--snow' };
const LINE_TOK = { line:'--line', detail:'--detail', koline:'--ko-line', live:'--live' };
const TEXT_TOK = { ink:'--ink', paint:'--line' };
// Night is one palette for both themes: the day colours slide toward it after dusk.
const NIGHT = {
  fill:{ ground:'#0e0f10', road:'#0a0b0b', body:'#111213', deck:'#141516', kob:'#8c9093', kod:'#999da0', glass:'#08090a', livef:'#f4f5f5',
    window:'#e9ebec', lamp:'#f4f5f5', sea:'#090a0b', sand:'#141516', grass:'#0c0d0e', snow:'#232628' },
  line:{ line:'#33373a', detail:'#202325', koline:'#3d4144', live:'#f4f5f5' },
  text:{ ink:'#70757a', paint:'#33373a' } };
const FILL = {}, LINE = {}, TEXT = { ink:[], paint:[] };
// Faces are flat and unlit, pushed back a hair so the hairlines drawn on them always win the depth test.
for (const k in FILL_TOK) FILL[k] = new THREE.MeshBasicMaterial({ side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 });
// 1 css px at any zoom: the WebGL stand-in for vector-effect:non-scaling-stroke.
for (const k in LINE_TOK) LINE[k] = new LineMaterial({ linewidth:1, worldUnits:false });
const DAYC = { fill:{}, line:{}, text:{} }, NIGHTC = { fill:{}, line:{}, text:{} };
for (const g in NIGHT) for (const k in NIGHT[g]) NIGHTC[g][k] = new THREE.Color(NIGHT[g][k]);
let dusk = 0;   // 0 is full day, 1 full night
function applyTheme() {
  for (const k in FILL_TOK) DAYC.fill[k] = new THREE.Color(css(FILL_TOK[k]));
  for (const k in LINE_TOK) DAYC.line[k] = new THREE.Color(css(LINE_TOK[k]));
  for (const k in TEXT_TOK) DAYC.text[k] = new THREE.Color(css(TEXT_TOK[k]));
  shade(dusk, true);
}
// windows and lamps come on early in the dusk and go off late in the dawn
function shade(n, force) {
  if (!force && Math.abs(n - dusk) < 0.002) return;
  dusk = n; const lit = Math.min(1, n * 1.8);
  for (const k in FILL) FILL[k].color.copy(DAYC.fill[k]).lerp(NIGHTC.fill[k], k === 'window' || k === 'lamp' ? lit : n);
  for (const k in LINE) LINE[k].color.copy(DAYC.line[k]).lerp(NIGHTC.line[k], n);
  for (const k in TEXT) { const c = DAYC.text[k].clone().lerp(NIGHTC.text[k], n); for (const m of TEXT[k]) m.color.copy(c); }
}
applyTheme();

// ---- renderer ----
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true }); }
catch (err) { $('note').hidden = false; $('note').textContent = 'This figure needs WebGL, which this browser has turned off.'; $('readout').textContent = 'no webgl'; throw err; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
// Anything outside the world's slab is cut, so traffic and walkers slide in and out of the plate's edge.
renderer.clippingPlanes = [
  new THREE.Plane(new THREE.Vector3(1, 0, 0), 0.05), new THREE.Plane(new THREE.Vector3(-1, 0, 0), 440.05),
  new THREE.Plane(new THREE.Vector3(0, 0, 1), 84.05), new THREE.Plane(new THREE.Vector3(0, 0, -1), 336.05)];
const ANISO = renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene();

// ---- parts: boxes and flat detail, collected into a few draw calls ----
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const TONE = { n:['body','deck','line'], k:['kob','kod','koline'], g:['glass','glass','line'], gr:['body','ground','line'], gs:['body','grass','line'],
  l:['lamp','lamp','line'], w:['window','window','line'], s:['body','sand','line'] };
const TEX_PX = 64;
class Part {
  constructor() { this.fill = {}; this.lines = {}; this.texts = []; }
  tri(k, a, b, c) { (this.fill[k] ??= []).push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z); }
  poly(k, p) { for (let i = 1; i < p.length - 1; i++) this.tri(k, p[0], p[i], p[i + 1]); }
  seg(k, a, b) { (this.lines[k] ??= []).push(a.x, a.y, a.z, b.x, b.y, b.z); return this; }
  // A flat polygon swept along e. Faces are turned to point away from the solid's middle; up-facing ones take the
  // deck fill, and only those steeper than 35° downward are left out, since the camera never sees them at any heading.
  extrude(pts, e, tone = 'n', { seams = true, lines = true } = {}) {
    const [bodyK, deckK, lineK] = TONE[tone];
    const A = pts.map(p => W(...p)), E = W(...e), B = A.map(p => p.clone().add(E));
    const mid = [...A, ...B].reduce((s, p) => s.add(p), v3(0, 0, 0)).multiplyScalar(1 / (A.length * 2));
    const face = q => {
      const n = v3(0, 0, 0).crossVectors(q[1].clone().sub(q[0]), q[2].clone().sub(q[0])).normalize();
      if (n.dot(q.reduce((s, p) => s.add(p), v3(0, 0, 0)).multiplyScalar(1 / q.length).sub(mid)) < 0) n.negate();
      if (n.y < -0.82) return;
      this.poly(n.y > 0.6 ? deckK : bodyK, q);
    };
    face(A); face(B);
    for (let i = 0; i < A.length; i++) { const j = (i + 1) % A.length; face([A[i], A[j], B[j], B[i]]); }
    if (lines) for (let i = 0; i < A.length; i++) { const j = (i + 1) % A.length;
      this.seg(lineK, A[i], A[j]); this.seg(lineK, B[i], B[j]); if (seams) this.seg(lineK, A[i], B[i]); }
    return this;
  }
  // box at (x,y,z), size w along x, d along y, h along z — same signature as the skill's box()
  box(x, y, z, w, d, h, tone, o) { return this.extrude([[x, y, z], [x + w, y, z], [x + w, y + d, z], [x, y + d, z]], [0, 0, h], tone, o); }
  cylZ(cx, cy, z, r, h, n = 12, tone) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push([cx + r * Math.cos(a), cy + r * Math.sin(a), z]); }
    return this.extrude(p, [0, 0, h], tone, { seams:false }); }
  cylY(cx, y, cz, r, len, n = 10, tone) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push([cx + r * Math.cos(a), y, cz + r * Math.sin(a)]); }
    return this.extrude(p, [0, len, 0], tone, { seams:false }); }
  // 2D linework in a face's local units, like drawing inside the skill's <g transform="${FRONT(…)}">.
  // lift nudges it off the face along the outward normal (negative for faces whose plane normal points out).
  draw(M, segs, k = 'detail', lift = 0.04) {
    const off = v3(0, 0, 0).setFromMatrixColumn(M, 2).normalize().multiplyScalar(-lift);
    const at = (u, v) => v3(u, v, 0).applyMatrix4(M).add(off);
    for (let i = 0; i < segs.length; i += 4) this.seg(k, at(segs[i], segs[i + 1]), at(segs[i + 2], segs[i + 3]));
    return this;
  }
  rect2(M, x, y, w, h, k, lift) { return this.draw(M, [x, y, x + w, y, x + w, y, x + w, y + h, x + w, y + h, x, y + h, x, y + h, x, y], k, lift); }
  fill2(M, x, y, w, h, k = 'glass', lift = 0.03) {
    const off = v3(0, 0, 0).setFromMatrixColumn(M, 2).normalize().multiplyScalar(-lift);
    const at = (u, v) => v3(u, v, 0).applyMatrix4(M).add(off);
    this.poly(k, [at(x, y), at(x + w, y), at(x + w, y + h), at(x, y + h)]);
    return this;
  }
  text(M, str, x, y, size, k = 'ink', anchor = 'start', lift = 0.035) { this.texts.push({ M, str, x, y, size, k, anchor, lift }); return this; }
  // any three.js geometry, flat-filled by facet direction, every facet edge a hairline
  geo(g, m, tone = 'n') {
    const [bodyK, deckK, lineK] = TONE[tone];
    g = (g.index ? g.toNonIndexed() : g.clone()).applyMatrix4(m);
    const p = g.attributes.position, a = v3(), b = v3(), c = v3(), n = v3();
    for (let i = 0; i < p.count; i += 3) {
      a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, i + 1); c.fromBufferAttribute(p, i + 2);
      n.crossVectors(b.clone().sub(a), c.clone().sub(a)).normalize();
      if (n.y > -0.82) this.tri(n.y > 0.45 ? deckK : bodyK, a, b, c);
    }
    const e = new THREE.EdgesGeometry(g).attributes.position;
    for (let i = 0; i < e.count; i += 2) this.seg(lineK, a.fromBufferAttribute(e, i).clone(), b.fromBufferAttribute(e, i + 1).clone());
    return this;
  }
  build(name) {
    const g = new THREE.Group(); if (name) g.name = name;
    for (const k in this.fill) {
      const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(this.fill[k], 3));
      const m = new THREE.Mesh(geo, FILL[k]); m.userData.fill = k; g.add(m);
    }
    for (const k in this.lines) {
      const l = new LineSegments2(new LineSegmentsGeometry().setPositions(this.lines[k]), LINE[k]);
      l.userData.line = k; l.raycast = noop; g.add(l);
    }
    for (const t of this.texts) g.add(textMesh(t));
    return g;
  }
}
// Text drawn flat on a plane: a canvas glyph texture (white) tinted by its token colour.
function textMesh({ M, str, x, y, size, k, anchor, lift }) {
  const font = `500 ${TEX_PX}px "DM Mono", ui-monospace, monospace`;
  const c = document.createElement('canvas'), g = c.getContext('2d'); g.font = font;

// The hills behind the plant: a height field, faceted and gridded, snow on the tops and pines low down.
function hillHeight(x, y) {
  const t = (-4 - y) / 80; if (t <= 0) return 0;
  const peaks = [[30, 30], [95, 44], [160, 33], [228, 48], [300, 38], [362, 46], [425, 34]];
  const ridge = Math.max(...peaks.map(([px, ph]) => ph * Math.exp(-(((x - px) / 34) ** 2)))) + 7;
  const s = t < 0.72 ? ease(t / 0.72) : 1 - 0.3 * (t - 0.72) / 0.28;
  return Math.max(0, ridge * s + (2.4 * Math.sin(x * 0.19 + y * 0.31) + 1.8 * Math.sin(x * 0.07 - y * 0.23)) * Math.min(1, t * 2));
}
function buildRange() {
  const p = new Part(), X = [], Y = [];
  for (let x = 0; x <= 440; x += 11) X.push(x);

  const P = X.map(x => Y.map(y => W(x, y, hillHeight(x, y))));
  const tri = (a, b, c) => {
    const n = v3(0, 0, 0).crossVectors(b.clone().sub(a), c.clone().sub(a)).normalize(); if (n.y < 0) n.negate();
    const zc = (a.y + b.y + c.y) / 3;

  };
  for (let i = 0; i < X.length - 1; i++) for (let j = 0; j < Y.length - 1; j++) {
    const a = P[i][j], b = P[i + 1][j], c = P[i + 1][j + 1], d = P[i][j + 1];
    if ((i + j) % 2) { tri(a, b, c); tri(a, c, d); } else { tri(a, b, d); tri(b, c, d); }
  }
  for (let i = 0; i < X.length; i++) for (let j = 0; j < Y.length - 1; j++) p.seg('detail', P[i][j], P[i][j + 1]);
  for (let j = 0; j < Y.length; j++) for (let i = 0; i < X.length - 1; i++) p.seg(j === 3 ? 'line' : 'detail', P[i][j], P[i + 1][j]);

}

// windows on one face, in rows from the top; at night only some of them light up
function windows(p, M, w, h, { x0 = 1.2, y0 = 1.0, ww = 1.4, wh = 1.5, dx = 3, dy = 3, skip = () => false, lit = 0.6 } = {}) {
  for (let v = y0; v + wh <= h - 0.4; v += dy) for (let u = x0; u + ww <= w - 0.3; u += dx) {

    p.fill2(M, u, v, ww, wh, rng() < lit ? 'window' : 'glass').rect2(M, u, v, ww, wh, 'line', 0.04);
  }
}

const vehicles = () => [...sim.forklifts, ...sim.trucks, ...incident.cars].sort((a, b) => a.id.localeCompare(b.id));
